name: CI

# `dev` is where work lands; `main` is frozen. GitHub-hosted runners are
# not available to this organisation, so the job runs on our own Linux
# build runner (labels as on the lab machine: self-hosted, Linux, X64,
# poolse-build). A runner with those labels has to be registered for
# this repository (or the organisation), or the job waits in the queue.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Single job: install, then exactly `pnpm check` (typecheck, lint,
# format-check, test, build), so green on CI means green on a laptop.
jobs:
  check:
    # The repo is public and the runner is our lab machine: never run a
    # pull request from a fork on it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, poolse-build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first so cross-workspace imports (`@poolse/react` →
      # `@poolse/sdk`) resolve to built artifacts in the test step.
      - run: pnpm build
      - run: pnpm check
